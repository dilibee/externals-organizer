<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Externals Organizer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an editorial study almanac. Cream masthead with ledger stats, a serif hero that says what today holds beside a dark countdown panel,
   cream feature cards for each day, a dark "today" column in the week, and a reading-room drawer for lessons. */
:root {
  --canvas: #faf9f5; --soft: #f5f0e8; --card: #efe9de; --cream-strong: #e8e0d2;
  --ink: #141413; --body: #3d3d3a; --muted: #6c6a64; --muted-soft: #8e8b82;
  --line: #e6dfd8; --line-soft: #ebe6df;
  --coral: #cc785c; --coral-active: #a9583e; --on-coral: #ffffff; --coral-soft: #f3dfd5;
  --dark: #181715; --dark-el: #252320; --dark-soft: #1f1e1b; --on-dark: #faf9f5; --on-dark-soft: #a09d96; --dark-line: #34312c;
  --ok: #3f9a57; --ok-soft: #dcefdf; --warn: #a57a12; --warn-soft: #f4e8c8; --bad: #c64545; --bad-soft: #f6dcd8;
  --t0: #3d7d70; --t1: #b7822f; --t2: #6e7d3c; --t3: #8d5470; --t4: #50698a; --t5: #a4573a;
  --shadow: 0 1px 3px rgba(20,20,19,.08);
  --f-display: "Newsreader", "Tiempos Headline", Georgia, "Times New Roman", serif;
  --f-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #1a1917; --soft: #201f1c; --card: #26241f; --cream-strong: #302d28;
  --ink: #f3efe7; --body: #d6d1c7; --muted: #a8a399; --muted-soft: #85817a;
  --line: #34312c; --line-soft: #2c2a26;
  --coral: #d98b6f; --coral-active: #e8a185; --on-coral: #1a1917; --coral-soft: #3b2a22;
  --dark: #0f0e0d; --dark-el: #1d1c1a; --dark-soft: #151413; --on-dark: #f3efe7; --on-dark-soft: #a09d96; --dark-line: #2e2c28;
  --ok: #6cc184; --ok-soft: #1d3324; --warn: #dcb04a; --warn-soft: #362d14; --bad: #e57a72; --bad-soft: #3b1f1c;
  --t0: #6fb6a6; --t1: #e0a95a; --t2: #a3b56a; --t3: #cf8eac; --t4: #8eaad0; --t5: #df8d6b;
  --shadow: 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #1a1917; --soft: #201f1c; --card: #26241f; --cream-strong: #302d28;
  --ink: #f3efe7; --body: #d6d1c7; --muted: #a8a399; --muted-soft: #85817a;
  --line: #34312c; --line-soft: #2c2a26;
  --coral: #d98b6f; --coral-active: #e8a185; --on-coral: #1a1917; --coral-soft: #3b2a22;
  --dark: #0f0e0d; --dark-el: #1d1c1a; --dark-soft: #151413; --on-dark: #f3efe7; --on-dark-soft: #a09d96; --dark-line: #2e2c28;
  --ok: #6cc184; --ok-soft: #1d3324; --warn: #dcb04a; --warn-soft: #362d14; --bad: #e57a72; --bad-soft: #3b1f1c;
  --t0: #6fb6a6; --t1: #e0a95a; --t2: #a3b56a; --t3: #cf8eac; --t4: #8eaad0; --t5: #df8d6b;
  --shadow: 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--canvas); color: var(--body); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--coral); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 400; color: var(--ink); text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.label { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.serif { font-family: var(--f-display); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- masthead ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--canvas) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 14px 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 23px; letter-spacing: -.3px; line-height: 1.1; }
.brand .date { display: block; font-family: var(--f-display); font-style: italic; color: var(--muted); font-size: 14.5px; line-height: 1.2; }
.ledger { display: flex; gap: 0; align-items: stretch; }
.ledger > div { display: grid; padding: 0 16px; border-left: 1px solid var(--line); line-height: 1.1; }
.ledger > div:first-child { border-left: 0; padding-left: 0; }
.ledger b { font-family: var(--f-display); font-weight: 400; font-size: 24px; color: var(--ink); letter-spacing: -.3px; }
.ledger span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: var(--r-md); color: var(--muted); font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab .sh { display: none; }
@media (max-width: 480px) { .tab { padding: 8px 11px; } .tab .lg { display: none; } .tab .sh { display: inline; } }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); }
.badge { background: var(--coral); color: var(--on-coral); border-radius: 999px; font-size: 11px; font-weight: 600; padding: 1px 7px; min-width: 20px; text-align: center; }
.badge.zero { background: var(--cream-strong); color: var(--muted); }
@media (max-width: 640px) {
  .ledger b { font-size: 19px; } .ledger > div { padding: 0 10px; }
  .brand h1 { font-size: 20px; }
}

main.wrap { padding-block: 36px 96px; }
.banner { padding: 16px 20px; border-radius: var(--r-lg); background: var(--warn-soft); color: var(--ink); }

/* ---------- generic ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 10px 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--canvas); cursor: pointer; font-weight: 500; font-size: 14px; line-height: 1; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted-soft); }
.btn.primary { background: var(--coral); border-color: var(--coral); color: var(--on-coral); }
.btn.primary:hover, .btn.primary:active { background: var(--coral-active); border-color: var(--coral-active); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.small { min-height: 32px; padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.circle { width: 36px; min-height: 36px; padding: 0; border-radius: 999px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stack { display: grid; gap: 20px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--card); color: var(--ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--cream-strong); color: var(--ink); }
.pill.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.pill.coral { background: var(--coral); color: var(--on-coral); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.tdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--tc, var(--coral)); }
.tname { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; font-size: 13px; color: var(--ink); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sec-head h2 { font-size: 36px; letter-spacing: -.5px; line-height: 1.15; }
.sec-head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 46ch; }
.empty { padding: 48px 32px; text-align: center; color: var(--muted); background: var(--soft); border-radius: var(--r-lg); }
.empty h3 { font-size: 28px; letter-spacing: -.3px; margin-bottom: 8px; }
.empty p { margin: 0 auto; max-width: 44ch; }

/* ---------- today: hero ---------- */
.hero-band { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 24px; align-items: stretch; margin-bottom: 40px; }
@media (max-width: 860px) { .hero-band { grid-template-columns: minmax(0, 1fr); } }
.hero-text { display: grid; gap: 14px; align-content: center; }
.hero-text h2 { font-size: clamp(36px, 5.4vw, 56px); line-height: 1.06; letter-spacing: -1.2px; }
.hero-text h2 em { font-style: italic; color: var(--coral); }
.hero-text .lede { font-size: 18px; line-height: 1.5; color: var(--body); max-width: 52ch; margin: 0; }
.countdown { background: var(--dark); color: var(--on-dark); border-radius: var(--r-xl); padding: 28px; display: grid; gap: 16px; align-content: space-between; min-height: 230px; position: relative; overflow: hidden; }
.countdown .label { color: var(--on-dark-soft); }
.countdown .big { display: flex; align-items: baseline; gap: 10px; }
.countdown .big b { font-family: var(--f-display); font-weight: 400; font-size: 96px; line-height: .9; letter-spacing: -3px; color: var(--on-dark); }
.countdown .big span { font-family: var(--f-display); font-style: italic; font-size: 22px; color: var(--on-dark-soft); }
.countdown h3 { color: var(--on-dark); font-size: 22px; line-height: 1.25; letter-spacing: -.2px; }
.countdown .sub { color: var(--on-dark-soft); font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.countdown .tname { color: var(--on-dark); }
.countdown .ticks { position: absolute; right: 22px; top: 24px; display: flex; gap: 4px; }
.countdown .ticks i { width: 6px; height: 22px; border-radius: 3px; background: var(--dark-line); }
.countdown .ticks i.on { background: var(--coral); }

/* ---------- today: grid ---------- */
.today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start; }
@media (max-width: 900px) { .today-grid { grid-template-columns: minmax(0,1fr); } }
.daycard { background: var(--card); border-radius: var(--r-lg); padding: 32px; display: grid; gap: 18px; }
.daycard .meta { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.daycard .dnum { font-family: var(--f-display); font-style: italic; color: var(--muted); font-size: 15px; }
.daycard h3 { font-size: 30px; line-height: 1.18; letter-spacing: -.4px; }
.daycard .focus { margin: -6px 0 0; color: var(--muted); font-size: 15.5px; }
.segs { display: flex; gap: 4px; }
.segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--cream-strong); }
.segs i.on { background: var(--tc, var(--coral)); }
.daycard .foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
.daycard .foot .count { margin-left: auto; font-family: var(--f-display); font-size: 20px; color: var(--ink); }
.daycard .foot .count small { font-family: var(--f-body); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-left: 4px; }

/* tasks */
.tasks { list-style: none; margin: 0; padding: 0; display: grid; }
.task { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 11px 4px; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task input { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 1px 0 0; border-radius: 50%; border: 1.5px solid var(--muted-soft); background: var(--canvas); cursor: pointer; display: grid; place-content: center; transition: background .15s, border-color .15s; }
.task input::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--canvas); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.task input:checked { background: var(--tc, var(--ok)); border-color: var(--tc, var(--ok)); }
.task input:checked::after { opacity: 1; }
.task input:disabled { cursor: default; opacity: .6; }
.task .tx { min-width: 0; color: var(--ink); cursor: pointer; overflow-wrap: anywhere; }
.task .tx code { font-family: var(--f-mono); font-size: .86em; background: var(--cream-strong); padding: 1px 5px; border-radius: 4px; }
.task.done .tx { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 55%, transparent); }
.task .mins { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 2px; }
.task a.lc { font-size: 12.5px; font-weight: 500; text-decoration: none; margin-left: 8px; white-space: nowrap; color: var(--coral); }

/* rail */
.rail { display: grid; gap: 20px; }
.rcard { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; display: grid; gap: 14px; background: var(--canvas); }
.ringrow { display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 18px; align-items: center; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.ring .c b { font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--ink); letter-spacing: -.5px; }
.ring .c span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.legend { display: grid; gap: 6px; font-size: 13px; }
.legend div { display: flex; gap: 8px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; position: relative; }
.timeline::before { content: ""; position: absolute; left: 21px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }
.timeline li { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; padding: 7px 0; position: relative; }
.timeline .when { text-align: center; background: var(--canvas); position: relative; line-height: 1; padding-block: 2px; }
.timeline .when b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 24px; color: var(--ink); }
.timeline .when span { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.timeline .what { font-weight: 500; color: var(--ink); line-height: 1.35; font-size: 14px; }
.timeline .rel { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
.timeline li.soon .when b { color: var(--coral); }
.cu-mini b { font-family: var(--f-display); font-weight: 400; font-size: 34px; color: var(--ink); line-height: 1; }

/* ---------- week ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; }
@media (max-width: 980px) { .week { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 560px) { .week { grid-template-columns: minmax(0,1fr); } }
.wcol { --wc-bg: var(--soft); --wc-ink: var(--ink); --wc-muted: var(--muted); --wc-item: var(--canvas); --wc-line: var(--line);
  background: var(--wc-bg); color: var(--wc-ink); border-radius: var(--r-lg); padding: 16px 12px 14px; display: grid; gap: 10px; align-content: start; min-height: 220px; }
.wcol.is-today { --wc-bg: var(--dark); --wc-ink: var(--on-dark); --wc-muted: var(--on-dark-soft); --wc-item: var(--dark-el); --wc-line: var(--dark-line); }
.wcol.past { opacity: .72; }
.wcol > * { min-width: 0; }
.witem .t, .flag { overflow-wrap: anywhere; }
.wcol .wd { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.wcol .wd b { font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: .95; letter-spacing: -1px; color: var(--wc-ink); }
.wcol .wd span { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--wc-muted); text-align: right; }
.wcol .wd span em { display: block; font-style: normal; color: var(--coral); }
.load { display: grid; gap: 4px; }
.load .bar { height: 3px; border-radius: 2px; background: var(--wc-line); overflow: hidden; }
.load .bar span { display: block; height: 100%; background: var(--wc-muted); }
.load .bar span.over { background: var(--bad); }
.load .cap { font-family: var(--f-mono); font-size: 11px; color: var(--wc-muted); }
.witem { text-align: left; border: 1px solid var(--wc-line); border-radius: var(--r-md); padding: 10px; background: var(--wc-item); color: var(--wc-ink); cursor: pointer; display: grid; gap: 6px; width: 100%; }
.witem:hover { border-color: var(--tc, var(--coral)); }
.witem .tname { color: var(--wc-muted); font-size: 11.5px; }
.witem .t { font-family: var(--f-display); font-size: 16px; line-height: 1.25; color: var(--wc-ink); }
.witem .s { font-size: 11.5px; color: var(--wc-muted); display: flex; justify-content: space-between; gap: 6px; }
.witem .s .fin { color: var(--ok); font-weight: 500; }
.flag { font-size: 12px; font-weight: 500; color: var(--on-coral); background: var(--coral); border-radius: var(--r-sm); padding: 6px 8px; line-height: 1.3; }
.free { font-family: var(--f-display); font-style: italic; color: var(--wc-muted); font-size: 15px; }

/* ---------- goals ---------- */
.goals { display: grid; gap: 48px; }
.tracklist { display: grid; }
.goal-row { display: grid; grid-template-columns: 88px minmax(0,1fr); gap: 24px; padding-block: 32px; border-top: 1px solid var(--line); }
.goal-row:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 640px) { .goal-row { grid-template-columns: minmax(0,1fr); gap: 10px; } }
.rankcol { display: grid; gap: 10px; align-content: start; justify-items: start; }
.rankno { font-family: var(--f-display); font-size: 72px; line-height: .85; letter-spacing: -2px; color: var(--tc); }
.rankbtns { display: flex; gap: 6px; }
@media (max-width: 640px) { .rankcol { grid-template-columns: auto auto; align-items: end; justify-content: space-between; width: 100%; } .rankno { font-size: 56px; } }
.goal-body { display: grid; gap: 16px; min-width: 0; }
.goal-body h3 { font-size: 30px; letter-spacing: -.4px; line-height: 1.15; }
.goal-body .goaltext { margin: 0; font-size: 16px; color: var(--body); max-width: 68ch; }
.goal-body .goaltext code { font-family: var(--f-mono); font-size: .86em; background: var(--card); padding: 1px 5px; border-radius: 4px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); }
.facts > div { padding: 16px 18px; display: grid; gap: 6px; border-left: 1px solid var(--line); min-width: 0; }
.facts > div:first-child { border-left: 0; }
.facts .v { font-family: var(--f-display); font-size: 22px; color: var(--ink); line-height: 1.15; letter-spacing: -.2px; }
.facts .v small { font-family: var(--f-body); font-size: 12.5px; color: var(--muted); margin-left: 4px; }
@media (max-width: 640px) { .facts { grid-template-columns: minmax(0,1fr); } .facts > div { border-left: 0; border-top: 1px solid var(--line); } .facts > div:first-child { border-top: 0; } }
.progressbar { height: 4px; background: var(--cream-strong); border-radius: 99px; overflow: hidden; }

<script>
(() => {
"use strict";
// ---------- state ----------
const S = { db: null, sample: null, tracks: {}, days: {}, progress: {}, sources: {}, settings: { hours: {0:180,1:90,2:90,3:90,4:90,5:90,6:180} },
  view: "today", weekOffset: 0, loaded: { tracks: false, days: false }, dbFailed: false, open: null, openTab: "lesson" };
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const KIND = { lesson: "Lesson", mock: "Mock test", assessment: "Assessment", review: "Review", project: "Project" };

// ---------- date helpers ----------
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const todayISO = () => iso(new Date());
const nice = s => { const d = parse(s); return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const hrs = m => `${+(m / 60).toFixed(2)}h`;
const fmtMin = m => m >= 60 ? (m % 60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m/60}h`) : `${m} min`;

// ---------- utils ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
function toast(msg) { const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2600); }
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------- markdown (small, safe subset) ----------
function inline(t) {
  let s = esc(t);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length-1}\u0000`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  return s;
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let out = "", i = 0;
  const para = [];
  const flush = () => { if (para.length) { out += `<p>${inline(para.join(" "))}</p>`; para.length = 0; } };
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { flush(); const lang = L.replace(/^```/, "").trim(); const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out += `<div class="codewin"><div class="cbar"><span>${esc(lang || "code")}</span><button type="button" data-copy>Copy</button></div><pre><code>${esc(buf.join("\n"))}</code></pre></div>`; continue; }
    let m;
    if ((m = L.match(/^:::hint\s*(.*)$/))) { flush(); const buf = []; i++; while (i < lines.length && !/^:::\s*$/.test(lines[i])) buf.push(lines[i++]); i++; out += `<details><summary>${inline(m[1] || "Hint")}</summary>${md(buf.join("\n"))}</details>`; continue; }
    if ((m = L.match(/^(#{1,4})\s+(.*)$/))) { flush(); const lv = Math.min(4, m[1].length + 1); out += `<h${lv}>${inline(m[2])}</h${lv}>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(L) || /^\s*\d+\.\s+/.test(L)) {
      flush(); const ordered = /^\s*\d+\./.test(L); const items = [];
      while (i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i];
        if (/^\s*([-*]|\d+\.)\s+/.test(l)) items.push(l.replace(/^\s*([-*]|\d+\.)\s+/, "")); else items[items.length-1] += " " + l.trim();
        i++;
      }
      out += `<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`; continue;
    }
    if (/^>\s?/.test(L)) { flush(); const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, "")); out += `<blockquote>${md(buf.join("\n"))}</blockquote>`; continue; }
    if (!L.trim()) { flush(); i++; continue; }
    para.push(L.trim()); i++;
  }
  flush();
  return out;
}

// ---------- derived data ----------
const trackList = () => Object.entries(S.tracks).map(([id, t]) => ({ id, ...t })).sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99));
const tColor = t => `var(--t${((t?.hue ?? 0) % 6 + 6) % 6})`;
const dayList = () => Object.entries(S.days).map(([id, d]) => ({ id, ...d })).filter(d => S.tracks[d.trackId]);
const doneMap = id => (S.progress[id] && S.progress[id].done) || {};
const dayMinutes = d => (d.tasks || []).reduce((a, t) => a + (Number(t.min) || 0), 0);
const dayDoneCount = d => (d.tasks || []).filter(t => doneMap(d.id)[t.id]).length;
const dayComplete = d => (d.tasks || []).length > 0 && dayDoneCount(d) === d.tasks.length;
function nextDeadline(t, from) {
  const ds = [...(t.milestones || []).map(m => m.date), t.deadline].filter(x => x && x >= from).sort();
  return ds[0] || null;
}
function prioritize(items, from) {
  return items.sort((a, b) => {
    const ta = S.tracks[a.trackId], tb = S.tracks[b.trackId];
    const da = nextDeadline(ta, from) || "9999", dbb = nextDeadline(tb, from) || "9999";
    if (da !== dbb) return da < dbb ? -1 : 1;           // nearest deadline first
    return (ta.rank ?? 99) - (tb.rank ?? 99);            // your ranking breaks ties
  });
}
const daysOn = date => prioritize(dayList().filter(d => d.date === date), date);
const catchup = () => { const t = todayISO(); return dayList().filter(d => d.date < t && !dayComplete(d)).sort((a, b) => a.date < b.date ? -1 : 1); };
function stats() {
  const dates = new Set(); let mins = 0, tasks = 0; const perTrack = {};
  for (const d of dayList()) {
    const dm = doneMap(d.id);
    for (const t of d.tasks || []) if (dm[t.id]) {
      dates.add(dm[t.id]); mins += Number(t.min) || 0; tasks++;
      perTrack[d.trackId] = (perTrack[d.trackId] || 0) + 1;
    }
  }
  let streak = 0, cur = todayISO();
  if (!dates.has(cur)) cur = addDays(cur, -1);
  while (dates.has(cur)) { streak++; cur = addDays(cur, -1); }
  return { streak, mins, tasks, perTrack, studiedToday: dates.has(todayISO()) };
}
const availMin = date => Number(S.settings.hours?.[parse(date).getDay()] ?? 0);
function trackProgress(tid) {
  const t = todayISO(); let all = 0, done = 0, due = 0, dueDone = 0;
  for (const d of dayList().filter(d => d.trackId === tid)) for (const k of d.tasks || []) {
    const ok = !!doneMap(d.id)[k.id]; all++; if (ok) done++;
    if (d.date <= t) { due++; if (ok) dueDone++; }
  }
  return { all, done, due, dueDone };
}

// ---------- writes ----------
const chains = {};
function write(path, fn) {   // one write at a time per document
  chains[path] = (chains[path] || Promise.resolve()).then(fn).catch(e => {
    console.error(e);
    toast(e && e.code === "quota_exceeded" ? "Storage is full; remove some old data." : "Couldn't save that change. Check your connection and try again.");
  });
  return chains[path];
}
function toggleTask(dayId, taskId, on) {
  const d = S.days[dayId]; if (!d || !S.db) return;
  const done = { ...doneMap(dayId) };
  if (on) done[taskId] = todayISO(); else delete done[taskId];
  S.progress[dayId] = { ...(S.progress[dayId] || {}), dayId, trackId: d.trackId, done };
  render();
  const body = { dayId, trackId: d.trackId, done, updatedAt: new Date().toISOString() };
  write("progress/" + dayId, () => S.db.doc("progress/" + dayId).set(body));
}

// ---------- rendering ----------
function render() {
  { const td = parse(todayISO()); $("#hdrDate").textContent = `${td.toLocaleDateString("en-CA", { weekday: "long" })}, ${td.toLocaleDateString("en-CA", { month: "long" })} ${td.getDate()}`; }
  const st = stats();
  $("#hdrStats").innerHTML = `
    <div title="Days in a row with at least one task checked"><b class="num">${st.streak}</b><span>day streak</span></div>
    <div title="Planned time of the tasks you've checked off"><b class="num">${fmtMin(st.mins)}</b><span>logged</span></div>
    <div><b class="num">${st.tasks}</b><span>task${st.tasks === 1 ? "" : "s"} done</span></div>`;
  const cu = catchup().length;
  const b = $("#cuBadge"); b.textContent = cu; b.classList.toggle("zero", cu === 0);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === S.view)));
  const main = $("#main");
  const keepFocus = document.activeElement && document.activeElement.id;
  if (!S.db && S.dbFailed) { main.innerHTML = `<div class="banner">Your plan is stored with this page on claude.ai. Open it from claude.ai while signed in to load it.</div>`; return; }
  if (!S.loaded.tracks || !S.loaded.days) { main.innerHTML = `<div class="loading"><span class="label">One moment</span><h2>Opening your plan…</h2></div>`; return; }
  main.innerHTML = `<div class="${S._shown === S.view ? "" : "view-in"}">${({ today: viewToday, week: viewWeek, goals: viewGoals, catchup: viewCatchup }[S.view] || viewToday)()}</div>`;
  S._shown = S.view;
  if (keepFocus && document.getElementById(keepFocus)) document.getElementById(keepFocus).focus();
  if (S.open) renderDrawer();
}

function taskRows(d, opts = {}) {
  const dm = doneMap(d.id);
  return `<ul class="tasks">${(d.tasks || []).map(t => {
    const on = !!dm[t.id]; const cid = `cb-${d.id}-${t.id}`;
    const lc = t.url ? `<a class="lc" href="${esc(t.url)}" target="_blank" rel="noopener">${/leetcode/.test(t.url) ? "LeetCode" : "Open"} ↗</a>` : "";
    return `<li class="task ${on ? "done" : ""}"><input type="checkbox" id="${cid}" data-day="${esc(d.id)}" data-task="${esc(t.id)}" ${on ? "checked" : ""} ${S.db ? "" : "disabled"}>
      <label class="tx" for="${cid}">${inline(t.text)}${lc}</label><span class="mins num">${fmtMin(Number(t.min)||0)}</span></li>`;
  }).join("")}</ul>`;
}
function trackTag(t) { return `<span class="tname" style="--tc:${tColor(t)}"><span class="tdot"></span>${esc(t.short || t.name)}</span>`; }
function dayOfTotal(d) { const n = dayList().filter(x => x.trackId === d.trackId).length; return `Day ${d.dayNum} of ${n}`; }

const WORDS = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight"];
const kindPill = d => `<span class="pill ${d.kind === "assessment" ? "bad" : d.kind === "mock" ? "warn" : "info"}">${KIND[d.kind] || "Lesson"}</span>`;
const relDays = dd => dd === 0 ? "Today" : dd === 1 ? "Tomorrow" : `In ${dd} days`;
function segs(d) { const dm = doneMap(d.id); return `<div class="segs" aria-hidden="true">${(d.tasks || []).map(t => `<i class="${dm[t.id] ? "on" : ""}"></i>`).join("")}</div>`; }

function ringSVG(doneMin, planned, avail) {
  const total = Math.max(planned, avail, 1), C = 2 * Math.PI * 46;
  const a = doneMin / total * C, b = Math.max(0, planned - doneMin) / total * C;
  const over = planned > avail;
  return `<svg viewBox="0 0 112 112" aria-hidden="true">
    <circle cx="56" cy="56" r="46" fill="none" stroke="var(--cream-strong)" stroke-width="9"/>
    ${b > 0 ? `<circle cx="56" cy="56" r="46" fill="none" stroke="${over ? "var(--bad)" : "var(--ink)"}" stroke-width="9" stroke-dasharray="${b} ${C}" stroke-dashoffset="${-a}" stroke-linecap="butt"/>` : ""}
    ${a > 0 ? `<circle cx="56" cy="56" r="46" fill="none" stroke="var(--ok)" stroke-width="9" stroke-dasharray="${a} ${C}"/>` : ""}
  </svg>`;
}

function viewToday() {
  const today = todayISO(); const items = daysOn(today);
  const cu = catchup();
  const planned = items.reduce((a, d) => a + dayMinutes(d), 0);
  const doneMin = items.reduce((a, d) => a + (d.tasks||[]).filter(t => doneMap(d.id)[t.id]).reduce((x, t) => x + (Number(t.min)||0), 0), 0);
  const avail = availMin(today);
  const cuMin = cu.reduce((a, d) => a + (d.tasks||[]).filter(t => !doneMap(d.id)[t.id]).reduce((x, t) => x + (Number(t.min)||0), 0), 0);
  const tl = trackList();
  const ms = tl.flatMap(t => (t.milestones || []).filter(m => m.date >= today).map(m => ({ ...m, t }))).sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 6);
  const over = planned - avail;
  const leftMin = Math.max(0, planned - doneMin);

  // hero copy
  const n = items.length;
  const allDone = n && items.every(dayComplete);
  const headline = !n ? `A free day.` : allDone ? `All done for <em>today</em>.` :
    `${WORDS[n] || n} session${n > 1 ? "s" : ""}, <em>${fmtMin(leftMin)}</em> to go.`;
  const order = items.map(d => { const t = S.tracks[d.trackId]; return `${esc(t.short || t.name)} Day ${d.dayNum}`; });
  const lede = !n ? (cu.length ? `Nothing new is scheduled. A good day to clear something from Catch-up.` : `Nothing scheduled. Rest, or add a goal on the Goals screen.`)
    : `${order.length > 1 ? order.slice(0, -1).join(", ") + " then " + order[order.length - 1] : order[0]}. ${over > 0 ? `That's ${fmtMin(over)} more than the ${fmtMin(avail)} you set aside.` : `${fmtMin(planned)} planned of ${fmtMin(avail)} available.`}`;

  const nx = ms[0];
  let countdown;
  if (nx) {
    const dd = diffDays(today, nx.date);
    countdown = `<aside class="countdown" aria-label="Next deadline">
      <span class="label">Next deadline</span>
      <div class="big"><b class="num">${dd}</b><span>${dd === 1 ? "day left" : dd === 0 ? "days. It's today" : "days left"}</span></div>
      <div><h3>${esc(nx.label)}</h3><div class="sub" style="margin-top:8px">${trackTagOf(nx.t)}<span>${esc(nice(nx.date))}</span></div></div>
    </aside>`;
  } else {
    countdown = `<aside class="countdown"><span class="label">Next deadline</span><div class="big"><span>Nothing due.</span></div><h3>No milestones ahead.</h3></aside>`;
  }

  const cards = n ? items.map(d => {
    const t = S.tracks[d.trackId]; const dn = dayDoneCount(d), k = (d.tasks||[]).length;
    return `<article class="daycard" style="--tc:${tColor(t)}">
      <div class="meta">${trackTag(t)}<span class="dnum">${dayOfTotal(d)}</span>${kindPill(d)}<span class="mono num" style="font-size:12px">${fmtMin(dayMinutes(d))}</span></div>
      <h3>${esc(d.title)}</h3>
      ${d.focus ? `<p class="focus">${esc(d.focus)}</p>` : ""}
      ${segs(d)}
      ${taskRows(d)}
      <div class="foot"><button class="btn primary" data-open="${esc(d.id)}" data-tab="lesson">Open lesson</button><button class="btn" data-open="${esc(d.id)}" data-tab="ask" ${S.sample ? "" : "hidden"}>Ask about this day</button><span class="count num">${dn}/${k}<small>done</small></span></div>
    </article>`;
  }).join("") : `<div class="empty"><h3>Nothing on the desk</h3><p>${cu.length ? "A good day to clear something from Catch-up." : "Rest, or add a goal on the Goals screen."}</p></div>`;

  return `<section class="hero-band">
      <div class="hero-text"><span class="label">${esc(nice(today))} · ${fmtMin(avail)} set aside</span><h2>${headline}</h2><p class="lede">${lede}</p></div>
      ${countdown}
    </section>
    <div class="today-grid">
    <section class="stack" aria-label="Today's plan">${cards}</section>
    <aside class="rail">
      <div class="rcard"><span class="label">Today's time</span>
        <div class="ringrow"><div class="ring">${ringSVG(doneMin, planned, avail)}<div class="c"><b class="num">${fmtMin(planned)}</b><span>of ${fmtMin(avail)}</span></div></div>
          <div class="legend"><div><i style="background:var(--ok)"></i>${fmtMin(doneMin)} done</div><div><i style="background:${over > 0 ? "var(--bad)" : "var(--ink)"}"></i>${fmtMin(leftMin)} left</div><div><i style="background:var(--cream-strong)"></i>${over > 0 ? `${fmtMin(over)} over` : `${fmtMin(Math.max(0, avail - planned))} spare`}</div></div></div>
      </div>
      <div class="rcard"><div class="spread"><span class="label">Up next</span><button class="btn ghost small" data-view="goals">All deadlines</button></div>
        ${ms.length ? `<ol class="timeline">${ms.map(m => { const dd = diffDays(today, m.date); const d = parse(m.date); return `<li class="${dd <= 3 ? "soon" : ""}"><div class="when"><b class="num">${d.getDate()}</b><span>${MON[d.getMonth()]}</span></div><div><div class="what">${esc(m.label)}</div><div class="rel">${relDays(dd)} · ${trackTag(m.t)}</div></div></li>`; }).join("")}</ol>` : `<div class="muted">No upcoming deadlines.</div>`}
      </div>
      <div class="rcard cu-mini"><span class="label">Catch-up</span>
        ${cu.length ? `<div class="row" style="align-items:baseline;gap:10px"><b class="num">${cu.length}</b><span class="muted">past day${cu.length > 1 ? "s" : ""} unfinished · ${fmtMin(cuMin)} of tasks</span></div><div><button class="btn small" data-view="catchup">Open catch-up</button></div>` : `<div class="muted">Nothing behind. Dates stay fixed; anything you miss lands here.</div>`}
      </div>
    </aside>
  </div>`;
}
function trackTagOf(t) { return `<span class="tname" style="--tc:${tColor(t)}"><span class="tdot"></span>${esc(t.short || t.name)}</span>`; }

function viewWeek() {
  const today = todayISO(); const t0 = parse(today);
  const monday = addDays(today, -((t0.getDay() + 6) % 7) + S.weekOffset * 7);
  const dates = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  const tl = trackList();
  let wkPlanned = 0, wkAvail = 0;
  const cols = dates.map(date => {
    const items = daysOn(date); const planned = items.reduce((a, d) => a + dayMinutes(d), 0); const avail = availMin(date);
    wkPlanned += planned; wkAvail += avail;
    const flags = tl.flatMap(t => (t.milestones || []).filter(m => m.date === date).map(m => `<div class="flag">${esc(m.label)}</div>`)).join("");
    const d = parse(date); const pct = avail ? Math.min(100, planned / avail * 100) : (planned ? 100 : 0);
    return `<div class="wcol ${date === today ? "is-today" : ""} ${date < today ? "past" : ""}">
      <div class="wd"><b class="num">${d.getDate()}</b><span>${date === today ? "<em>Today</em>" : ""}${DOW[d.getDay()]}</span></div>
      <div class="load" title="planned / available"><div class="bar"><span class="${planned > avail ? "over" : ""}" style="width:${pct}%"></span></div><span class="cap num">${hrs(planned)} / ${hrs(avail)}</span></div>
      ${flags}
      ${items.map(x => { const t = S.tracks[x.trackId]; const n = (x.tasks||[]).length, dn = dayDoneCount(x);
        return `<button class="witem" style="--tc:${tColor(t)}" data-open="${esc(x.id)}" data-tab="lesson">${trackTag(t)}<span class="t">${esc(x.title)}</span><span class="s"><span>Day ${x.dayNum}</span>${dn === n && n ? `<span class="fin">Done</span>` : `<span class="num">${dn}/${n}</span>`}</span></button>`; }).join("") || `<span class="free">Free</span>`}
    </div>`;
  }).join("");
  const ld = parse(dates[6]), fd = parse(dates[0]);
  return `<div class="sec-head"><div><span class="label">${S.weekOffset === 0 ? "This week" : S.weekOffset > 0 ? `${S.weekOffset} week${S.weekOffset > 1 ? "s" : ""} ahead` : `${-S.weekOffset} week${S.weekOffset < -1 ? "s" : ""} back`} · ${hrs(wkPlanned)} planned of ${hrs(wkAvail)}</span>
      <h2>${MON[fd.getMonth()]} ${fd.getDate()} – ${fd.getMonth() === ld.getMonth() ? "" : MON[ld.getMonth()] + " "}${ld.getDate()}</h2></div>
    <div class="row"><button class="btn circle" data-week="-1" aria-label="Previous week">←</button><button class="btn small" data-week="0">This week</button><button class="btn circle" data-week="1" aria-label="Next week">→</button></div></div>
    <div class="week">${cols}</div>`;
}

function viewGoals() {
  const today = todayISO(); const tl = trackList(); const st = stats();
  const cuAll = catchup();
  const goals = tl.map((t, idx) => {
    const p = trackProgress(t.id); const nd = nextDeadline(t, today);
    const behind = cuAll.filter(d => d.trackId === t.id).length;
    const status = behind ? `<span class="pill warn">${behind} day${behind > 1 ? "s" : ""} in catch-up</span>` : `<span class="pill ok">On track</span>`;
    const tdays = dayList().filter(d => d.trackId === t.id).map(d => d.date).sort();
    const last = tdays[tdays.length - 1];
    const mss = (t.milestones || []).slice().sort((a,b)=>a.date<b.date?-1:1);
    return `<article class="goal-row" style="--tc:${tColor(t)}">
      <div class="rankcol"><span class="rankno num" aria-label="Rank ${idx + 1}">${idx + 1}</span>
        <div class="rankbtns"><button class="btn circle" data-rank="${esc(t.id)}" data-dir="-1" ${idx === 0 ? "disabled" : ""} aria-label="Move ${esc(t.short || t.name)} up">↑</button><button class="btn circle" data-rank="${esc(t.id)}" data-dir="1" ${idx === tl.length - 1 ? "disabled" : ""} aria-label="Move ${esc(t.short || t.name)} down">↓</button></div></div>
      <div class="goal-body">
        <div class="row">${trackTag(t)}${status}${tdays.length ? "" : `<span class="pill plain">No days scheduled</span>`}</div>
        <h3>${esc(t.name)}</h3>
        ${t.goal ? `<p class="goaltext">${inline(t.goal)}</p>` : ""}
        <div class="facts">
          <div><span class="label">Next deadline</span><span class="v num">${nd ? `${esc(nice(nd).slice(4))}<small>${relDays(diffDays(today, nd)).toLowerCase()}</small>` : "None"}</span></div>
          <div><span class="label">Due so far</span><span class="v num">${p.dueDone}/${p.due}<small>tasks</small></span><div class="progressbar"><span style="width:${p.due ? p.dueDone / p.due * 100 : 0}%"></span></div></div>
          <div><span class="label">Whole plan</span><span class="v num">${p.done}/${p.all}<small>tasks</small></span><div class="progressbar"><span style="width:${p.all ? p.done / p.all * 100 : 0}%"></span></div></div>
        </div>
        ${mss.length ? `<div style="display:grid;gap:10px"><span class="label">Milestones</span><ul class="mslist">${mss.map(m => `<li class="${m.date < today ? "past" : ""}"><span class="d">${nice(m.date).slice(4)}</span><span>${esc(m.label)}</span></li>`).join("")}</ul></div>` : ""}
        ${filesRow(t.id)}
        <div class="goal-foot"><span class="muted">${last ? `${tdays.length} days, ${esc(nice(tdays[0]).slice(4))} to ${esc(nice(last).slice(4))}` : "No days yet."}</span>
          <button class="btn small" data-extend="${esc(t.id)}" ${S.sample && S.extendOpen !== t.id ? "" : "hidden"} style="margin-left:auto">Plan next week with AI</button></div>
        ${S.extendOpen === t.id ? `<div class="preview">${extendBox(t.id)}</div>` : ""}
      </div>
    </article>`;
  }).join("") || `<div class="empty"><h3>No goals yet</h3><p>Add your first goal below.</p></div>`;
  const hrs = S.settings.hours || {};
  const order = [1,2,3,4,5,6,0];
  const maxTasks = Math.max(1, ...tl.map(t => st.perTrack[t.id] || 0));
  const weekTotal = order.reduce((a, i) => a + Number(hrs[i] ?? 0), 0);
  return `<div class="goals">
    <section>
      <div class="sec-head"><div><span class="label">${tl.length} tracks · ranked</span><h2>Goals &amp; deadlines</h2></div><p>Each day's order: nearest deadline first, then your rank. Use the arrows to change rank.</p></div>
      <div class="tracklist">${goals}</div>
    </section>
    <div class="two">
      <section class="feature"><span class="label">${fmtMin(weekTotal)} a week</span><h3>Your weekly hours</h3><p class="muted">Hours you can study each day. Today and Week compare your plan against these.</p>
        <div class="avail">${order.map(i => `<label for="hr-${i}">${DOW[i]}<input id="hr-${i}" type="number" min="0" max="16" step="0.25" value="${S.hoursDraft ? esc(S.hoursDraft[i]) : (Number(hrs[i] ?? 0) / 60)}" data-hr="${i}"></label>`).join("")}</div>
        <div class="row"><button class="btn primary small" id="saveHours" ${S.db ? "" : "disabled"}>Save hours</button></div>
      </section>
      <section class="feature"><span class="label">Since you started</span><h3>Stats</h3>
        <div class="bigstats"><div><b class="num">${st.streak}</b><span class="label">day streak</span></div>
          <div><b class="num sm">${fmtMin(st.mins)}</b><span class="label">logged</span></div>
          <div><b class="num">${st.tasks}</b><span class="label">tasks</span></div></div>
        <div class="bars">${tl.map(t => `<div class="b" style="--tc:${tColor(t)}"><span class="tname"><span class="tdot"></span>${esc(t.short || t.name)}</span><span class="track"><span style="width:${(st.perTrack[t.id] || 0) / maxTasks * 100}%"></span></span><span class="n">${st.perTrack[t.id] || 0}</span></div>`).join("")}</div>
      </section>
    </div>
    ${addGoalForm()}
  </div>`;
}

function filesRow(tid) {
  const files = (S.sources[tid] && S.sources[tid].files) || [];
  const size = files.reduce((a, f) => a + String(f.content || "").length, 0);
  return `<div class="files"><span class="label">Files the AI helper can read</span>
    ${files.length ? `<div class="row" style="gap:6px">${files.map((f, i) => `<span class="fchip">${esc(f.name)}<button class="btn ghost small" style="min-height:24px;padding:0 6px" data-rmfile="${esc(tid)}" data-idx="${i}" aria-label="Remove ${esc(f.name)}">✕</button></span>`).join("")}</div>
      <div class="muted" style="font-size:12.5px">${files.length} file${files.length === 1 ? "" : "s"} · ${Math.round(size / 1024)} KB of 200 KB. Ask AI and Expand lesson read these for every day in this track.</div>` : `<div class="muted" style="font-size:13px">None yet. Add code or notes so the AI answers from your real files.</div>`}
    <div class="row"><label class="btn small" for="files-${esc(tid)}">Add files</label><input type="file" id="files-${esc(tid)}" data-addfiles="${esc(tid)}" multiple hidden accept=".js,.gs,.ts,.py,.cpp,.h,.hpp,.c,.java,.html,.css,.md,.txt,.json,.csv,.sql,.yml,.yaml"></div></div>`;
}
async function addFiles(tid, list) {
  if (!S.db || !list.length) return;
  const files = [...((S.sources[tid] && S.sources[tid].files) || [])];
  for (const f of list) {
    const text = await f.text().catch(() => null);
    if (text == null || /\u0000/.test(text)) { toast(`${f.name} isn't a text file`); continue; }
    const i = files.findIndex(x => x.name === f.name); const entry = { name: f.name, content: text };
    if (i >= 0) files[i] = entry; else files.push(entry);
  }
  const size = files.reduce((a, f) => a + f.content.length, 0);
  if (size > 200000) { toast("That's over 200 KB of files. Add fewer or smaller files."); return; }
  S.sources[tid] = { files }; render();
  write("sources/" + tid, () => S.db.doc("sources/" + tid).set({ files, updatedAt: new Date().toISOString() })).then(() => toast("Files saved"));
}
function removeFile(tid, idx) {
  const files = [...((S.sources[tid] && S.sources[tid].files) || [])]; files.splice(idx, 1);
  S.sources[tid] = { files }; render();
  write("sources/" + tid, () => S.db.doc("sources/" + tid).set({ files, updatedAt: new Date().toISOString() }));
}

    </div>

    <div class="row"><button class="btn primary" id="draftGoal" ${S.drafting ? "disabled" : ""}>Draft plan</button><span class="muted" id="draftStatus" style="font-size:13px">${esc(S.draftStatus || "")}</span></div>
    ${S.pendingPlan && S.pendingPlan.kind === "new" ? previewHTML(S.pendingPlan.plan, "Save goal and plan") : ""}
  </section>`;

function viewCatchup() {
  const cu = catchup(); const today = todayISO();
  if (!cu.length) return `<div class="empty"><h3>All caught up</h3><p>When a past day has unchecked tasks, it shows up here. Dates in your plan never move.</p></div>`;
  const left = cu.reduce((a, d) => a + (d.tasks||[]).filter(x => !doneMap(d.id)[x.id]).length, 0);
  const mins = cu.reduce((a, d) => a + (d.tasks||[]).filter(x => !doneMap(d.id)[x.id]).reduce((s, x) => s + (Number(x.min)||0), 0), 0);
  return `<section class="callout"><div><span class="lab">Catch-up</span><h2>${cu.length === 1 ? "One day" : `${WORDS[cu.length] || cu.length} days`} still open.</h2><p>Oldest first. Check tasks off here, or open the day for its lesson.</p></div>

// ---------- AI: context ----------
function learnerBlock(t) {

}

  for (const f of files) {

}
const CHAT_RULES = `You are the study coach inside Dilibe's planner. Rules:

const errCopy = e => ({ not_granted: "Claude isn't allowed for this page. You can allow it from the page's permissions.", rate_limited: "Too many requests right now. Try again in a minute.", session_expired: "Sign in to claude.ai again, then retry.", refused: "Claude declined that request. Try rephrasing.", prompt_too_large: "That was too long. Ask about a smaller piece.", invalid_json: "The plan came back in the wrong shape. Try again." }[e && e.code] || "Something went wrong reaching Claude. Try again.");

const PLAN_SHAPE = `Reply with only JSON of this shape:
{"short": "2-12 char label", "goal": "one sentence", "milestones": [{"date":"YYYY-MM-DD","label":"..."}],
 "days": [{"date":"YYYY-MM-DD","title":"...","kind":"lesson|mock|assessment|review|project","focus":"few words",

async function draftGoal() {

  S.drafting = true; S.pendingPlan = null; render(); setStatus("draftStatus", "draftStatus", "Drafting… this can take a minute or two.");

function extendRange(tid) {

  const last = mine.length ? mine[mine.length - 1].date : addDays(todayISO(), -1);

}

  if (el.hasAttribute("data-copy")) { const code = el.closest(".codewin")?.querySelector("code"); if (!code) return;
    const done = ok => { el.textContent = ok ? "Copied" : "Select and copy"; setTimeout(() => { el.textContent = "Copy"; }, 1600); };
    try { navigator.clipboard.writeText(code.textContent).then(() => done(true), () => { selectText(code); done(false); }); } catch { selectText(code); done(false); }
    return; }
  if (el.dataset.view) { S.view = el.dataset.view; store.set("eo.view", S.view); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.open) { openDay(el.dataset.open, el.dataset.tab); return; }
  if (el.hasAttribute("data-close")) { closeDay(); return; }
  if (el.dataset.dtab) { S.openTab = el.dataset.dtab; S.showShort = false; renderDrawer(); if (S.openTab === "ask" && (!S.chat || S.chat.id !== S.open)) loadChat(); return; }
  if (el.dataset.week != null) { const v = Number(el.dataset.week); S.weekOffset = v === 0 ? 0 : S.weekOffset + v; render(); return; }
  if (el.dataset.rmfile) { removeFile(el.dataset.rmfile, Number(el.dataset.idx)); return; }
  if (el.dataset.rank) { moveRank(el.dataset.rank, Number(el.dataset.dir)); return; }
  if (el.dataset.extend) { S.extendOpen = el.dataset.extend; S.extendStatus = ""; if (S.pendingPlan && S.pendingPlan.kind === "extend") S.pendingPlan = null; render(); return; }
  if (el.dataset.extendGo) { extendGo(el.dataset.extendGo); return; }
  if (el.dataset.quick) { const ta = $("#chatInput"); if (ta) { ta.value = el.dataset.quick; S.chatDraft = ta.value; ta.focus(); } return; }
  switch (el.id) {
    case "saveHours": saveHours(); break;
    case "draftGoal": draftGoal(); break;
    case "savePlan": savePlan(); break;
    case "discardPlan": S.pendingPlan = null; render(); break;
    case "cancelExtend": S.extendOpen = null; S.extendStatus = ""; if (S.pendingPlan && S.pendingPlan.kind === "extend") S.pendingPlan = null; render(); break;
    case "sendChat": sendChat(($("#chatInput") || {}).value || ""); break;
    case "stopChat": if (S.ctl) S.ctl.abort(); break;
    case "clearChat": S.chat = { id: S.open, turns: [] }; if (S.db) write("chats/" + S.open, () => S.db.doc("chats/" + S.open).set({ dayId: S.open, turns: [] })); renderDrawer(); break;
    case "expandLesson": expandLesson(); break;
    case "showShort": S.showShort = true; renderDrawer(); break;
    case "showFull": S.showShort = false; renderDrawer(); break;
  }
});
document.addEventListener("change", e => { const c = e.target; if (c.dataset && c.dataset.addfiles) { addFiles(c.dataset.addfiles, [...c.files]); c.value = ""; return; } if (c.matches('input[type="checkbox"][data-day]')) toggleTask(c.dataset.day, c.dataset.task, c.checked); });
document.addEventListener("input", e => {
  const el = e.target, id = el.id || "";
  if (id === "chatInput") S.chatDraft = el.value;
  else if (id === "ext-note") S.extendNote = el.value;
  else if (id.startsWith("g-")) { S.goalDraft = { ...(S.goalDraft || {}), [id.slice(2)]: el.value }; }
  else if (el.dataset.hr != null) { if (!S.hoursDraft) { S.hoursDraft = {}; for (let i = 0; i < 7; i++) S.hoursDraft[i] = Number(S.settings.hours?.[i] ?? 0) / 60; } S.hoursDraft[el.dataset.hr] = el.value; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.open) closeDay();
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "chatInput") sendChat(e.target.value);
});

async function moveRank(tid, dir) {
  const tl = trackList(); const i = tl.findIndex(t => t.id === tid); const j = i + dir; if (j < 0 || j >= tl.length || !S.db) return;
  const order = tl.map(t => t.id); [order[i], order[j]] = [order[j], order[i]];
  order.forEach((id, k) => { S.tracks[id] = { ...S.tracks[id], rank: k + 1 }; });
  render();
  for (const [k, id] of order.entries()) await write("tracks/" + id, () => S.db.doc("tracks/" + id).update({ rank: k + 1 }));
}
function saveHours() {
  const hours = {}; document.querySelectorAll("[data-hr]").forEach(inp => { hours[inp.dataset.hr] = Math.max(0, Math.round((Number(inp.value) || 0) * 60)); });
  S.settings = { ...S.settings, hours }; S.hoursDraft = null; render();
  write("settings/main", () => S.db.doc("settings/main").set({ hours })).then(() => toast("Hours saved"));
}

// ---------- boot ----------
const saved = store.get("eo.view", null); if (["today","week","goals","catchup"].includes(location.hash.slice(1))) S.view = location.hash.slice(1); else if (saved) S.view = saved;
render();
// re-render at midnight so "today" moves on
setInterval(() => { if (S._d !== todayISO()) { S._d = todayISO(); if (!S.open) render(); } }, 60000); S._d = todayISO();

(async () => {
  const C = window.claude;
  if (!C || !C.use) { S.dbFailed = true; render(); return; }
  C.use("sample").then(s => { S.sample = s || null; if (S.loaded.days) render(); }).catch(() => {});
  const db = await C.use("db").catch(() => null);
  if (!db) { S.dbFailed = true; render(); return; }
  S.db = db;
  const onErr = e => { console.error(e); if (e && e.code === "revoked") { S.db = null; S.dbFailed = true; render(); } };
  const toMap = snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); return m; };
  db.collection("tracks").onSnapshot(s => { S.tracks = toMap(s); S.loaded.tracks = true; render(); }, onErr);
  db.collection("days").onSnapshot(s => { S.days = toMap(s); S.loaded.days = true; render(); }, onErr);
  db.collection("progress").onSnapshot(s => { S.progress = toMap(s); render(); }, onErr);
  db.collection("sources").onSnapshot(s => { S.sources = toMap(s); render(); }, onErr);
  db.doc("settings/main").onSnapshot(s => { if (s.exists && s.data().hours) { S.settings = s.data(); render(); } }, onErr);
})();
})();
</script>

</body></html>
